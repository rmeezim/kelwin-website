<section class="km km-evidence-V ac-sec" data-surface="light" aria-labelledby="km-evidence-V-title">
  <!-- head grammar (round 2 X, with round 3's lede): label → two-voice statement → 48×2 red rule → lede -->
  <div class="ac-head ac-wrap">
    <div class="ac-labelrow"><p class="ac-label">The structural read</p><p class="ac-meta">Fig. 03</p></div>
    <h2 class="ac-statement" id="km-evidence-V-title">
      <span class="ac-line"><span>Four numbers.</span></span>
      <span class="ac-line ac-accent"><span>One diagnosis.</span></span>
    </h2>
    <span class="ac-rule" aria-hidden="true"></span>
    <p class="ac-lede">Every one gets blamed on the pipeline. Not one of them moves with more activity.</p>
  </div>

  <!-- FIG. 03 (round 2 X, kept): the 2×2 of readings on a hairline cross, the caption band below.
       Only the centre changes: the dot field becomes THE SPECIMEN CHIP, a painted block of 100 units.
       Red paints the active reading's share from the base over a pale ground, the reading's figure is
       printed into the block (paper where the red covers it), a calibrated scale and a mono strip read
       it out, and one line names the unit in words. The numerals and the band control drive it. -->
  <figure class="km-evidence-V__plate ac-wrap">
    <div class="km-evidence-V__grid">
      <span class="km-evidence-V__rule km-evidence-V__rule--top" aria-hidden="true"></span>
      <span class="km-evidence-V__rule km-evidence-V__rule--mid" aria-hidden="true"></span>
      <span class="km-evidence-V__rule km-evidence-V__rule--v" aria-hidden="true"></span>

      <article class="km-evidence-V__cell km-evidence-V__cell--tl is-active" data-n="0" style="--i:0">
        <p class="km-evidence-V__meta"><span class="km-evidence-V__tag"><span class="km-evidence-V__led" aria-hidden="true"></span><span class="ac-cap km-evidence-V__idx">01 · Visibility</span></span><span class="ac-cap">Source · Gartner</span></p>
        <button type="button" class="km-evidence-V__num" aria-pressed="true" aria-controls="km-evidence-V-chip" data-n="0"><span class="km-evidence-V__mask"><span class="km-evidence-V__n">17<span class="km-evidence-V__u">%</span></span></span></button>
        <p class="km-evidence-V__claim">Buyers spend just 17% of the journey with sales.</p>
        <p class="km-evidence-V__so">The deal is decided by your narrative — not your reps.</p>
      </article>

      <article class="km-evidence-V__cell km-evidence-V__cell--tr" data-n="1" style="--i:1">
        <p class="km-evidence-V__meta"><span class="km-evidence-V__tag"><span class="km-evidence-V__led" aria-hidden="true"></span><span class="ac-cap km-evidence-V__idx">02 · Timing</span></span><span class="ac-cap">Source · Ehrenberg-Bass</span></p>
        <button type="button" class="km-evidence-V__num" aria-pressed="false" aria-controls="km-evidence-V-chip" data-n="1" tabindex="-1"><span class="km-evidence-V__mask"><span class="km-evidence-V__n">95<span class="km-evidence-V__u">:5</span></span></span></button>
        <p class="km-evidence-V__claim">95% of your market isn’t buying right now.</p>
        <p class="km-evidence-V__so">You win by being remembered when they are — not by chasing harder.</p>
      </article>

      <article class="km-evidence-V__cell km-evidence-V__cell--bl" data-n="2" style="--i:2">
        <p class="km-evidence-V__meta"><span class="km-evidence-V__tag"><span class="km-evidence-V__led" aria-hidden="true"></span><span class="ac-cap km-evidence-V__idx">03 · Complexity</span></span><span class="ac-cap">Source · Gartner</span></p>
        <button type="button" class="km-evidence-V__num" aria-pressed="false" aria-controls="km-evidence-V-chip" data-n="2" tabindex="-1"><span class="km-evidence-V__mask"><span class="km-evidence-V__n">77<span class="km-evidence-V__u">%</span></span></span></button>
        <p class="km-evidence-V__claim">77% of buyers say the purchase was hard to make.</p>
        <p class="km-evidence-V__so">The friction is your buying process — make deciding easier and you win.</p>
      </article>

      <article class="km-evidence-V__cell km-evidence-V__cell--br" data-n="3" style="--i:3">
        <p class="km-evidence-V__meta"><span class="km-evidence-V__tag"><span class="km-evidence-V__led" aria-hidden="true"></span><span class="ac-cap km-evidence-V__idx">04 · Experience</span></span><span class="ac-cap">Source · CEB · HBR</span></p>
        <button type="button" class="km-evidence-V__num" aria-pressed="false" aria-controls="km-evidence-V-chip" data-n="3" tabindex="-1"><span class="km-evidence-V__mask"><span class="km-evidence-V__n">53<span class="km-evidence-V__u">%</span></span></span></button>
        <p class="km-evidence-V__claim">53% of loyalty comes from the buying experience.</p>
        <p class="km-evidence-V__so">How you sell outweighs brand, product, and price combined.</p>
      </article>

              <span class="km-evidence-V__sv" style="--t:0">0</span>
            </div>
          </div>

          <div class="km-evidence-V__reads" aria-live="polite">
            <div class="km-evidence-V__read is-on" data-n="0">
              <p class="km-evidence-V__strip"><span class="ac-cap">R·01 · Visibility</span><span class="ac-cap km-evidence-V__val">100 = the purchase</span></p>
              <p class="km-evidence-V__unit">Share of the purchase spent with sales — every vendor combined.</p>
            </div>
            <div class="km-evidence-V__read" data-n="1">

            <div class="km-evidence-V__read" data-n="2">
              <p class="km-evidence-V__strip"><span class="ac-cap">R·03 · Complexity</span><span class="ac-cap km-evidence-V__val">100 = buyers</span></p>
              <p class="km-evidence-V__unit">Share of buyers who found the purchase hard.</p>
            </div>
            <div class="km-evidence-V__read" data-n="3">
              <p class="km-evidence-V__strip"><span class="ac-cap">R·04 · Experience</span><span class="ac-cap km-evidence-V__val">100 = loyalty</span></p>
