<section class="km km-evidence-U ac-sec" data-surface="light" aria-labelledby="km-evidence-U-title">

  <div class="ac-head ac-wrap">

    <h2 class="ac-statement" id="km-evidence-U-title">
      <span class="ac-line"><span>Four numbers.</span></span>
      <span class="ac-line ac-accent"><span>One diagnosis.</span></span>
    </h2>
    <span class="ac-rule" aria-hidden="true"></span>
    <p class="ac-lede">Every one gets blamed on the pipeline. Not one of them moves with more activity.</p>
  </div>

       reading's share from the base over a pale ground; a calibrated scale and a mono strip read it out,
       and one line names the unit in words. The big numerals are the one control (the page's only
       segmented toggle stays the reframe's). -->
  <figure class="km-evidence-U__plate ac-wrap">
    <div class="km-evidence-U__grid">
      <span class="km-evidence-U__rule km-evidence-U__rule--top" aria-hidden="true"></span>
      <span class="km-evidence-U__rule km-evidence-U__rule--mid" aria-hidden="true"></span>

      <article class="km-evidence-U__cell km-evidence-U__cell--tl is-active" data-n="0" style="--i:0">
        <p class="km-evidence-U__meta"><span class="km-evidence-U__tag"><span class="km-evidence-U__led" aria-hidden="true"></span><span class="ac-cap km-evidence-U__idx">01 · Visibility</span></span><span class="ac-cap">Source · Gartner</span></p>
        <button type="button" class="km-evidence-U__num" aria-pressed="true" aria-controls="km-evidence-U-chip" data-n="0"><span class="km-evidence-U__mask"><span class="km-evidence-U__n">17<span class="km-evidence-U__u">%</span></span></span></button>
        <p class="km-evidence-U__claim">Buyers spend just 17% of the journey with sales.</p>
        <p class="km-evidence-U__so">The deal is decided by your narrative — not your reps.</p>
      </article>

      <article class="km-evidence-U__cell km-evidence-U__cell--tr" data-n="1" style="--i:1">
        <p class="km-evidence-U__meta"><span class="km-evidence-U__tag"><span class="km-evidence-U__led" aria-hidden="true"></span><span class="ac-cap km-evidence-U__idx">02 · Timing</span></span><span class="ac-cap">Source · Ehrenberg-Bass</span></p>
        <button type="button" class="km-evidence-U__num" aria-pressed="false" aria-controls="km-evidence-U-chip" data-n="1" tabindex="-1"><span class="km-evidence-U__mask"><span class="km-evidence-U__n">95<span class="km-evidence-U__u">:5</span></span></span></button>
        <p class="km-evidence-U__claim">95% of your market isn’t buying right now.</p>
        <p class="km-evidence-U__so">You win by being remembered when they are — not by chasing harder.</p>
      </article>

      <article class="km-evidence-U__cell km-evidence-U__cell--bl" data-n="2" style="--i:2">
        <p class="km-evidence-U__meta"><span class="km-evidence-U__tag"><span class="km-evidence-U__led" aria-hidden="true"></span><span class="ac-cap km-evidence-U__idx">03 · Complexity</span></span><span class="ac-cap">Source · Gartner</span></p>
        <button type="button" class="km-evidence-U__num" aria-pressed="false" aria-controls="km-evidence-U-chip" data-n="2" tabindex="-1"><span class="km-evidence-U__mask"><span class="km-evidence-U__n">77<span class="km-evidence-U__u">%</span></span></span></button>
        <p class="km-evidence-U__claim">77% of buyers say the purchase was hard to make.</p>
        <p class="km-evidence-U__so">The friction is your buying process — make deciding easier and you win.</p>
      </article>

      <article class="km-evidence-U__cell km-evidence-U__cell--br" data-n="3" style="--i:3">
        <p class="km-evidence-U__meta"><span class="km-evidence-U__tag"><span class="km-evidence-U__led" aria-hidden="true"></span><span class="ac-cap km-evidence-U__idx">04 · Experience</span></span><span class="ac-cap">Source · CEB · HBR</span></p>
        <button type="button" class="km-evidence-U__num" aria-pressed="false" aria-controls="km-evidence-U-chip" data-n="3" tabindex="-1"><span class="km-evidence-U__mask"><span class="km-evidence-U__n">53<span class="km-evidence-U__u">%</span></span></span></button>
        <p class="km-evidence-U__claim">53% of loyalty comes from the buying experience.</p>
        <p class="km-evidence-U__so">How you sell outweighs brand, product, and price combined.</p>
      </article>
