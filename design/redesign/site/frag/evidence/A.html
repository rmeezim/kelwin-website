<section class="km km-evidence-A" data-surface="light" aria-labelledby="km-evidence-A-title">
  <div class="km-evidence-A__in">

      <p class="km-evidence-A__label"><span class="km-evidence-A__sq" aria-hidden="true"></span>The structural read</p>
      <p class="km-evidence-A__fignum">FIG. 03</p>
    </div>

    <div class="km-evidence-A__head">
      <h2 class="km-evidence-A__h" id="km-evidence-A-title">
        <span class="km-evidence-A__mask"><span class="km-evidence-A__l1">Four numbers.</span></span>
        <span class="km-evidence-A__mask"><span class="km-evidence-A__l2">One diagnosis.</span></span>
      </h2>
      <span class="km-evidence-A__hr" aria-hidden="true"></span>
      <p class="km-evidence-A__lede">Every one gets blamed on the pipeline. Every one is measuring something structural.</p>
    </div>

    <figure class="km-evidence-A__plate" data-state="diagnosis">
      <div class="km-evidence-A__grid">
        <span class="km-evidence-A__rule km-evidence-A__rule--top" aria-hidden="true"></span>
        <span class="km-evidence-A__rule km-evidence-A__rule--mid" aria-hidden="true"></span>
        <span class="km-evidence-A__rule km-evidence-A__rule--v" aria-hidden="true"></span>

        <article class="km-evidence-A__cell km-evidence-A__cell--tl" style="--i:0">
          <p class="km-evidence-A__meta"><span>01 · Visibility</span><span class="km-evidence-A__src">Source · Gartner</span></p>
          <p class="km-evidence-A__num"><span class="km-evidence-A__n" data-to="17">17</span><span class="km-evidence-A__u">%</span></p>
          <p class="km-evidence-A__claim">Buyers spend just 17% of the journey with sales.</p>
          <p class="km-evidence-A__so">The deal is decided by your narrative — not your reps.</p>
        </article>

        <article class="km-evidence-A__cell km-evidence-A__cell--tr" style="--i:1">
          <p class="km-evidence-A__meta"><span>02 · Timing</span><span class="km-evidence-A__src">Source · Ehrenberg-Bass</span></p>
          <p class="km-evidence-A__num"><span class="km-evidence-A__n" data-to="95">95</span><span class="km-evidence-A__u">:5</span></p>
          <p class="km-evidence-A__claim">95% of your market isn’t buying right now.</p>
          <p class="km-evidence-A__so">You win by being remembered when they are — not by chasing harder.</p>
        </article>

        <article class="km-evidence-A__cell km-evidence-A__cell--bl" style="--i:2">
          <p class="km-evidence-A__meta"><span>03 · Complexity</span><span class="km-evidence-A__src">Source · Gartner</span></p>
          <p class="km-evidence-A__num"><span class="km-evidence-A__n" data-to="77">77</span><span class="km-evidence-A__u">%</span></p>
          <p class="km-evidence-A__claim">77% of buyers say the purchase was hard to make.</p>
          <p class="km-evidence-A__so">The friction is your buying process. Make deciding easier and you win.</p>
        </article>

        <article class="km-evidence-A__cell km-evidence-A__cell--br" style="--i:3">
          <p class="km-evidence-A__meta"><span>04 · Experience</span><span class="km-evidence-A__src">Source · CEB · HBR</span></p>
          <p class="km-evidence-A__num"><span class="km-evidence-A__n" data-to="53">53</span><span class="km-evidence-A__u">%</span></p>
          <p class="km-evidence-A__claim">53% of loyalty comes from the buying experience.</p>
          <p class="km-evidence-A__so">How you sell outweighs brand, product and price combined.</p>
        </article>

        <!-- FIG. 03: each reading is a square whose AREA is its value, anchored bottom-left in a 100-unit
             frame (Readings). Diagnosis: the four frames become one and the squares nest on one corner. -->
        <div class="km-evidence-A__fig" aria-hidden="true">
          <span class="km-evidence-A__clear"></span>
          <span class="km-evidence-A__frames">

            <span class="km-evidence-A__frame km-evidence-A__frame--bl"></span>
            <span class="km-evidence-A__frame km-evidence-A__frame--br"></span>
          </span>
          <span class="km-evidence-A__unit"></span>
          <span class="km-evidence-A__a km-evidence-A__a--95" style="--n:0"><span class="km-evidence-A__v">95%</span></span>
          <span class="km-evidence-A__a km-evidence-A__a--77" style="--n:1"><span class="km-evidence-A__v">77%</span></span>
          <span class="km-evidence-A__a km-evidence-A__a--53" style="--n:2"><span class="km-evidence-A__v">53%</span></span>
          <span class="km-evidence-A__a km-evidence-A__a--17" style="--n:3"><span class="km-evidence-A__v">17%</span></span>
        </div>
      </div>
