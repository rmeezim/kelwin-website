<section class="km km-evidence-X ac-sec" data-surface="light" aria-labelledby="km-evidence-X-title">
  <!-- head grammar (A): label → two-voice statement → 48×2 red rule → lede -->
  <div class="ac-head ac-wrap">
    <div class="ac-labelrow"><p class="ac-label">The structural read</p><p class="ac-meta">Fig. 03</p></div>
    <h2 class="ac-statement" id="km-evidence-X-title">
      <span class="ac-line"><span>Four numbers.</span></span>
      <span class="ac-line ac-accent"><span>One diagnosis.</span></span>
    </h2>
    <span class="ac-rule" aria-hidden="true"></span>
    <p class="ac-lede">Every one gets blamed on the pipeline. Every one is measuring something structural.</p>
  </div>

       reading's share in turn. -->

      <article class="km-evidence-X__cell km-evidence-X__cell--tl is-active" data-n="1" style="--i:0">
        <p class="km-evidence-X__meta"><span class="ac-cap km-evidence-X__idx">01 · Visibility</span><span class="ac-cap">Source · Gartner</span></p>
        <p class="km-evidence-X__num"><span class="km-evidence-X__n" data-to="17">17</span><span class="km-evidence-X__u">%</span></p>
        <p class="km-evidence-X__claim">Buyers spend just 17% of the journey with sales.</p>
        <p class="km-evidence-X__so">The deal is decided by your narrative, not your reps.</p>
      </article>

      <article class="km-evidence-X__cell km-evidence-X__cell--tr" data-n="2" style="--i:1">
        <p class="km-evidence-X__meta"><span class="ac-cap km-evidence-X__idx">02 · Timing</span><span class="ac-cap">Source · Ehrenberg-Bass</span></p>
        <p class="km-evidence-X__num"><span class="km-evidence-X__n" data-to="95">95</span><span class="km-evidence-X__u">:5</span></p>
        <p class="km-evidence-X__claim">95% of your market isn’t buying right now.</p>
        <p class="km-evidence-X__so">You win by being remembered when they are, not by chasing harder.</p>
      </article>

      <article class="km-evidence-X__cell km-evidence-X__cell--bl" data-n="3" style="--i:2">
        <p class="km-evidence-X__meta"><span class="ac-cap km-evidence-X__idx">03 · Complexity</span><span class="ac-cap">Source · Gartner</span></p>
        <p class="km-evidence-X__num"><span class="km-evidence-X__n" data-to="77">77</span><span class="km-evidence-X__u">%</span></p>
        <p class="km-evidence-X__claim">77% of buyers say the purchase was hard to make.</p>
        <p class="km-evidence-X__so">The friction is your buying process. Make deciding easier and you win.</p>
      </article>

      <article class="km-evidence-X__cell km-evidence-X__cell--br" data-n="4" style="--i:3">
        <p class="km-evidence-X__meta"><span class="ac-cap km-evidence-X__idx">04 · Experience</span><span class="ac-cap">Source · CEB · HBR</span></p>
        <p class="km-evidence-X__num"><span class="km-evidence-X__n" data-to="53">53</span><span class="km-evidence-X__u">%</span></p>
        <p class="km-evidence-X__claim">53% of loyalty comes from the buying experience.</p>
        <p class="km-evidence-X__so">How you sell outweighs brand, product and price combined.</p>
      </article>
