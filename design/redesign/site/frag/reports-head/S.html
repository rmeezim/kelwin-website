  <!-- HEAD · cast at 104, stacked, two short lines, the accent the whole second line ("up close.",
       one of the site's four whole-line accents, D3). Coherence pass 3: "What a readout / looks
       like." left "readout" alone at 390 and 320; both lines here hold a 56px phone line. No
       kicker: the plate is the subject. One quiet action, down to the case-study request. -->
  <div class="ac-head ac-ihead ac-ihead--104 ac-wrap">
    <h1 class="ac-statement" id="km-reports-head-S-h1">
      <span class="ac-line"><span>A readout,</span></span>
      <span class="ac-line ac-accent"><span>up close.</span></span>
    </h1>
    <span class="ac-rule" aria-hidden="true"></span>
    <p class="ac-lede">Every System Audit ends in a written document that the client keeps. We go through it together on a 60-minute call.</p>
    <div class="ac-doors"><a class="ac-go ac-go--down" href="#km-reports-publishing-S-ask">Ask for a case study</a></div>
  </div>

  <!-- PLATE · sheet: page 1 of the readout, the same document the next section turns (pages 2–9),
