<section class="km km-reports-publishing-S ac-sec" data-surface="dark" id="km-reports-publishing-S-ask" aria-labelledby="km-reports-publishing-S-h">
  <div class="ac-wrap">
    <!-- THE CASE-STUDY REQUEST (founder, round 8: "ask them for their email so we can send them the
         case study"). One claim (the publication rule, the section's one big thing), the honest
         status said once, and one field. The submit is the kit's outlined action at 56px (no red:
         the page's red is the close's audit button). It writes a mail, it stores nothing. -->
    <div class="ac-shead ac-shead--claim km-reports-publishing-S__head">
      <div class="ac-labelrow"><p class="ac-label">Published work</p></div>
      <h2 class="ac-claim" id="km-reports-publishing-S-h">No case study goes out without the client’s yes.</h2>
      <p class="ac-shead__lede">None has cleared yet. We’ll email the first one, when a client clears it, to anyone who asks.</p>

      <form class="ac-form km-reports-publishing-S__form" action="mailto:audit@kelwin.co?subject=Case%20study%20request" method="post" enctype="text/plain" aria-label="Ask for the first case study">
        <div class="ac-field">
          <label class="ac-field__label" for="km-reports-publishing-S-mail">Your work email</label>
          <input class="ac-field__input" id="km-reports-publishing-S-mail" name="email" type="email" autocomplete="email" placeholder="name@company.com" required>
        </div>
        <div class="ac-form__actions">
          <button class="ac-btn-o ac-btn-o--lg" type="submit">Send me the first one</button>
        </div>
        <p class="ac-support km-reports-publishing-S__note">It opens in your own mail app, addressed to <a class="ac-go" href="mailto:audit@kelwin.co?subject=Case%20study%20request">audit@kelwin.co</a></p>
        <p class="ac-support km-reports-publishing-S__done" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>
