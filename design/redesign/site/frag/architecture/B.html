<section class="km km-architecture-B" data-surface="dark" aria-labelledby="km-arch-b-title">
  <span class="km-architecture-B__spine" aria-hidden="true"></span>

  <header class="km-architecture-B__head">
    <div class="km-architecture-B__open" aria-hidden="true"><span class="km-architecture-B__rule"></span><span class="km-architecture-B__joint"></span></div>
    <div class="km-architecture-B__index">
      <span class="km-architecture-B__num">05</span>
      <span class="km-architecture-B__name"><span class="km-architecture-B__sq" aria-hidden="true"></span>Architecture</span>
    </div>
    <h2 class="km-architecture-B__title" id="km-arch-b-title"><span class="km-architecture-B__s1">Three layers.</span> <span class="km-architecture-B__s2">One closed loop.</span></h2>
    <span class="km-architecture-B__redrule" aria-hidden="true"></span>
    <p class="km-architecture-B__body">Narrative shapes what the market hears. Channels put it in motion. Intelligence feeds back what works&nbsp;— and that returning signal is why the system compounds instead of resetting.</p>
  </header>

  <figure class="km-architecture-B__dia" aria-label="The signal loop: market signal leaves the spine into Narrative, runs to Channels and Intelligence, exits as compounding pipeline, and a red return path carries what was learned back into Narrative.">
    <svg class="km-architecture-B__svg" viewBox="0 0 1440 500" width="1440" height="500" aria-hidden="true">
      <!-- input: leaves the spine at a right angle -->
      <path class="km-architecture-B__ln km-architecture-B__seg" data-seg="1" d="M387 64.5H509.5"/>
      <rect class="km-architecture-B__jt km-architecture-B__injt" x="383.5" y="61.5" width="6" height="6"/>
      <text class="km-architecture-B__mono km-architecture-B__inlab" x="398" y="92">MARKET</text>
      <text class="km-architecture-B__mono km-architecture-B__inlab" x="398" y="108">SIGNAL</text>

      <!-- forward: 1 → 2 (top), 2 → 3 (right) -->
      <path class="km-architecture-B__ln km-architecture-B__seg km-architecture-B__top" data-seg="2" d="M509.5 64.5H930.5"/>
      <path class="km-architecture-B__ln km-architecture-B__seg km-architecture-B__right" data-seg="3" d="M930.5 64.5V424.5"/>

      <!-- output: from Intelligence to the right margin -->
      <path class="km-architecture-B__ln km-architecture-B__out" d="M930.5 424.5H1376"/>
      <text class="km-architecture-B__mono km-architecture-B__mono--dim km-architecture-B__outlab" x="1376" y="448" text-anchor="end">COMPOUNDING PIPELINE →</text>

      <!-- THE ONE RED LINE: the return, Intelligence → Narrative, drawn as the mark's right angle -->
      <path class="km-architecture-B__ret km-architecture-B__seg" data-seg="4" d="M930.5 424.5H509.5V64.5"/>

      <!-- the second feedback: Intelligence reroutes effort back up into Channels (dashed, parallel to the forward line) -->
      <g class="km-architecture-B__reroute">
        <path class="km-architecture-B__dash km-architecture-B__seg" data-seg="4" d="M890.5 424V65"/>
        <path class="km-architecture-B__chev" d="M886 109L890.5 104.5L895 109"/>
        <text class="km-architecture-B__mono km-architecture-B__mono--dim" x="874" y="248.5" text-anchor="end">REROUTE EFFORT</text>
      </g>

      <!-- direction chevrons (hairline) -->
      <g class="km-architecture-B__chevs">
        <path class="km-architecture-B__chev" data-seg="2" d="M715.5 60L720 64.5L715.5 69"/>
        <path class="km-architecture-B__chev" data-seg="3" d="M926 240L930.5 244.5L935 240"/>
        <path class="km-architecture-B__chev km-architecture-B__chev--ret" d="M724.5 420L720 424.5L724.5 429"/>
        <path class="km-architecture-B__chev km-architecture-B__chev--ret" d="M505 249L509.5 244.5L514 249"/>
      </g>

      <!-- stations: joint squares + labels outside the corners -->
      <g class="km-architecture-B__st" data-n="1">
        <rect class="km-architecture-B__jt" x="506.5" y="61.5" width="6" height="6"/>
        <text class="km-architecture-B__mono" x="509.5" y="20">NARRATIVE</text>
        <text class="km-architecture-B__num2" x="527" y="122">01</text>
        <text class="km-architecture-B__desc" x="509.5" y="46">Positioning &amp; language</text>
      </g>
      <g class="km-architecture-B__st" data-n="2">
        <rect class="km-architecture-B__jt" x="927.5" y="61.5" width="6" height="6"/>
        <text class="km-architecture-B__mono" x="930.5" y="20" text-anchor="end">CHANNELS</text>
        <text class="km-architecture-B__num2" x="872" y="122" text-anchor="end">02</text>
        <text class="km-architecture-B__desc" x="930.5" y="46" text-anchor="end">Omnichannel orchestration</text>
      </g>
      <g class="km-architecture-B__st" data-n="3">
        <rect class="km-architecture-B__jt" x="927.5" y="421.5" width="6" height="6"/>
        <text class="km-architecture-B__mono" x="930.5" y="458" text-anchor="end">INTELLIGENCE</text>
        <text class="km-architecture-B__num2" x="872" y="404" text-anchor="end">03</text>
        <text class="km-architecture-B__desc" x="930.5" y="484" text-anchor="end">Observe &amp; learn</text>
      </g>
      <g class="km-architecture-B__st km-architecture-B__st--ret" data-n="4">
        <text class="km-architecture-B__mono" x="509.5" y="458">RETURN PATH</text>
        <text class="km-architecture-B__desc" x="509.5" y="484">Learn &amp; retune the narrative</text>
      </g>
    </svg>

    <figcaption class="km-architecture-B__cap">The signal loop, closed</figcaption>

    <div class="km-architecture-B__read">
      <p class="km-architecture-B__rlabel">How it closes</p>
      <ol class="km-architecture-B__ledger">
        <li class="km-architecture-B__row" data-seg="1" style="--i:0">
          <button type="button" class="km-architecture-B__rowhead" aria-expanded="false">
            <span class="km-architecture-B__ri">N·01</span><span class="km-architecture-B__rt">Define</span><span class="km-architecture-B__tg" aria-hidden="true"></span>
          </button>
          <div class="km-architecture-B__rb"><p>Market signal sets the brief (ICP, intent, demand), and narrative shapes what the market hears.</p></div>
        </li>
        <li class="km-architecture-B__row" data-seg="2" style="--i:1">
          <button type="button" class="km-architecture-B__rowhead" aria-expanded="false">
            <span class="km-architecture-B__ri">N·02</span><span class="km-architecture-B__rt">Activate</span><span class="km-architecture-B__tg" aria-hidden="true"></span>
          </button>
          <div class="km-architecture-B__rb"><p>Channels put it in motion: email, social, phone, content and events.</p></div>
        </li>
        <li class="km-architecture-B__row" data-seg="3" style="--i:2">
          <button type="button" class="km-architecture-B__rowhead" aria-expanded="false">
            <span class="km-architecture-B__ri">N·03</span><span class="km-architecture-B__rt">Measure</span><span class="km-architecture-B__tg" aria-hidden="true"></span>
          </button>
          <div class="km-architecture-B__rb"><p>Every touch is instrumented, so intelligence observes what actually works.</p></div>
        </li>
        <li class="km-architecture-B__row is-open" data-seg="4" style="--i:3">
          <button type="button" class="km-architecture-B__rowhead" aria-expanded="true">
            <span class="km-architecture-B__ri">N·04</span><span class="km-architecture-B__rt">Retune</span><span class="km-architecture-B__tg" aria-hidden="true"></span>
          </button>
          <div class="km-architecture-B__rb"><p>Intelligence feeds back what works: it retunes the narrative and reroutes effort. That return is why it compounds.</p></div>
        </li>
      </ol>
    </div>

    <div class="km-architecture-B__keep">
      <p class="km-architecture-B__own">The asset is yours&nbsp;— narrative, channels and intelligence stay with your team.</p>
      <a class="km-architecture-B__link" href="/#methodology"><span>See how we install it</span> <svg class="km-architecture-B__ico" viewBox="0 0 14 12" aria-hidden="true"><path d="M1 6h12M8 1.5 12.5 6 8 10.5"/></svg></a>
    </div>
  </figure>
</section>
