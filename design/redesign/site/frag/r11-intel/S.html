  <!-- the plate: ONE QUARTER, AND WHAT IT CHANGES. The wrapper keeps the kit's gap but breaks .ac-int > .ac-plate,
       so the kit's rise-and-widen never plays: the plate fades in and its insides draw the process —
       the quarter is laid down week by week behind a playhead (a check every week; a call each time a deal is lost;
       the contact list rebuilt every week); the lanes are wired into one red page that writes itself (four calls
       light: they named the security review; the list squares stay hollow); then the page sets next quarter: a new
       solid row from week 1, the checks and calls carried on, the contact-list lane struck.
       The markup is the finished frame (reduced motion, no script, a screenshot). Three drawings: 1440 one row
       (words in HTML, they keep their size down to 1024) and tablet stacked, next quarter drawn under this one on
       the same week scale, reached by a return line (round 10's geometry, qa/r10/art/intel/gen-S2.mjs, unchanged);
       the phone (≤ 767) is round 11's own drawing in HTML at real size, after the measure (THE PHONE DRAWING).
