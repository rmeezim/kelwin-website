<section class="km km-r10-narr-S ac-sec ac-sec--ruled" data-surface="dark" aria-labelledby="km-r10-narr-S-h">

  <!-- WHAT IT IS — Narrative Systems answers "what is this?" in one look, on one invented company.
       The drawing is a row diagram read left to right: the written page (the Narrative OS, on paper) →
       one red line → five voices of the company → what the buyer takes away. Every row is one voice.
       Before: nothing is written down, the voices sit off any line, and five crossed wires leave the
       buyer holding five different stories (counted: 5 different companies). After: each voice is
       rewritten from its own line on the page (a leader runs from that line to the red line, the voice
       slides onto it and a caret re-sets its sentence), its note at the buyer is re-set the same way,
       the count falls 5 → 1, and the five notes close into one stack while the crossed wires straighten
       into one feed. The verb is "set to one line" (register), not the strike-and-rise the head picture
       and the homepage handover use.
       The markup is the end state (reduced motion, no script, a screenshot). S.js measures it and plays
       the four steps into it; each step waits for the part of the drawing it changes to be in view.
       Specimen throughout (said once, in the label row): the company, every sentence and the page. -->
  <div class="ac-wrap">
    <div class="ac-shead ac-shead--claim km-r10-narr-S__head">
      <div class="ac-labelrow"><p class="ac-label">What it is</p><p class="ac-status"><span class="ac-state">Specimen:</span> an invented forecasting-software company</p></div>
      <h2 class="ac-claim ac-claim--md km-r10-narr-S__claim" id="km-r10-narr-S-h"><span class="km-r10-narr-S__cl">A Narrative System is your story,</span> <span class="km-r10-narr-S__cl">written down once and used by everyone.</span></h2>
    </div>

    <div class="km-r10-narr-S__fig">
      <!-- the stepper: four buttons, cols 1–3 / 4–6 / 7–9 / 10–12; each shows the end of its step -->
      <div class="km-r10-narr-S__steps" role="group" aria-label="The four steps">
        <button type="button" class="km-r10-narr-S__step" data-s="1" aria-pressed="false" aria-controls="km-r10-narr-S-plate" style="--i:0">
          <span class="ac-numeral km-r10-narr-S__sn">01</span>
          <span class="km-r10-narr-S__st">Today, everyone tells your story their own way.</span>
        </button>
        <button type="button" class="km-r10-narr-S__step" data-s="2" aria-pressed="false" aria-controls="km-r10-narr-S-plate" style="--i:1">
          <span class="ac-numeral km-r10-narr-S__sn">02</span>
          <span class="km-r10-narr-S__st">So a buyer hears five different companies, and trusts none of them.</span>
        </button>
        <button type="button" class="km-r10-narr-S__step" data-s="3" aria-pressed="false" aria-controls="km-r10-narr-S-plate" style="--i:2">
          <span class="ac-numeral km-r10-narr-S__sn">03</span>
          <span class="km-r10-narr-S__st">We write the story down once: who it’s for, what to say to each buyer, and the proof.</span>
        </button>
        <button type="button" class="km-r10-narr-S__step is-cur" data-s="4" aria-pressed="true" aria-controls="km-r10-narr-S-plate" style="--i:3">
          <span class="ac-numeral km-r10-narr-S__sn">04</span>
          <span class="km-r10-narr-S__st">Now every call, email, page and post says the same thing, in words that fit who’s listening.</span>
        </button>
      </div>
      <p class="ac-sr km-r10-narr-S__live" aria-live="polite"></p>

      <figure class="ac-plate km-r10-narr-S__plate" id="km-r10-narr-S-plate" aria-labelledby="km-r10-narr-S-cap">
        <div class="km-r10-narr-S__field">

              <rect class="km-r10-narr-S__nd km-r10-narr-S__nd--t" x="908.0" y="340.0" width="4" height="4"/>
              <rect class="km-r10-narr-S__nd" x="758.0" y="446.0" width="4" height="4"/>
              <rect class="km-r10-narr-S__nd km-r10-narr-S__nd--t" x="908.0" y="340.0" width="4" height="4"/>

              <rect class="km-r10-narr-S__nd km-r10-narr-S__nd--t" x="908.0" y="340.0" width="4" height="4"/>

          <!-- the column keys -->
          <p class="ac-key km-r10-narr-S__vkey">Five voices of one company</p>
          <p class="ac-key km-r10-narr-S__bkey">The buyer</p>

          <!-- before the page exists: the place it will go -->
          <div class="km-r10-narr-S__hole" aria-hidden="true"><span class="km-r10-narr-S__holek">Nothing written down</span></div>

          <!-- the written page: the Narrative OS, on paper. Its five lines sit level with the five voices they feed. -->
          <article class="ac-sheet ac-sheet--sm ac-sheet--auto km-r10-narr-S__os" data-surface="light" aria-label="The written story for the invented company">
            <header class="ac-sheet__run ac-sheet__run--plain km-r10-narr-S__run"><span>Kelwin · Narrative OS</span></header>
            <section class="km-r10-narr-S__e" data-r="1">
              <h3 class="ac-sheet__h"><span class="ac-sheet__n">1</span>Who it’s for</h3>
              <p class="km-r10-narr-S__et">Finance teams whose CFO won’t sign the sales forecast.</p>
            </section>
            <section class="km-r10-narr-S__e" data-r="2">
              <h3 class="ac-sheet__h"><span class="ac-sheet__n">2</span>What to say to each buyer</h3>
              <p class="km-r10-narr-S__et"><span class="km-r10-narr-S__who">Head of sales:</span> a forecast that matches the pipeline.</p>
            </section>
            <div class="km-r10-narr-S__e km-r10-narr-S__e--sub" data-r="3">
              <p class="km-r10-narr-S__et"><span class="km-r10-narr-S__who">CFO:</span> a number you can defend.</p>
            </div>
            <div class="km-r10-narr-S__e km-r10-narr-S__e--sub" data-r="4">
              <p class="km-r10-narr-S__et"><span class="km-r10-narr-S__who">The ops team:</span> no new data to collect.</p>
            </div>
            <section class="km-r10-narr-S__e" data-r="5">
              <h3 class="ac-sheet__h"><span class="ac-sheet__n">3</span>The proof</h3>
              <p class="km-r10-narr-S__et">Last quarter’s forecast next to what closed.</p>
            </section>
          </article>

          <!-- the one line every voice is set to -->
          <span class="km-r10-narr-S__datum" aria-hidden="true"></span>

          <!-- the five voices, one per row, each rewritten from the line of the page level with it -->

            <li class="km-r10-narr-S__v" data-r="1">
              <p class="km-r10-narr-S__src">The founder, on a call</p>
              <p class="km-r10-narr-S__say"><span class="km-r10-narr-S__was"><span class="ac-sr">Before: </span>We’re an AI platform for finance teams.</span><span class="km-r10-narr-S__now"><span class="ac-sr">Now: </span>We build the sales forecast your CFO will sign.</span><span class="km-r10-narr-S__caret" aria-hidden="true"></span></p>
            </li>
            <li class="km-r10-narr-S__v" data-r="2">
              <p class="km-r10-narr-S__src">A rep’s email</p>
              <p class="km-r10-narr-S__say"><span class="km-r10-narr-S__was"><span class="ac-sr">Before: </span>We help sales teams hit quota with pipeline visibility.</span><span class="km-r10-narr-S__now"><span class="ac-sr">Now: </span>A forecast that finally matches your pipeline.</span><span class="km-r10-narr-S__caret" aria-hidden="true"></span></p>
            </li>
            <li class="km-r10-narr-S__v" data-r="3">
              <p class="km-r10-narr-S__src">A post</p>
              <p class="km-r10-narr-S__say"><span class="km-r10-narr-S__was"><span class="ac-sr">Before: </span>Spreadsheets are killing finance. We fix that.</span><span class="km-r10-narr-S__now"><span class="ac-sr">Now: </span>How to give your CFO a number they can defend.</span><span class="km-r10-narr-S__caret" aria-hidden="true"></span></p>
            </li>
            <li class="km-r10-narr-S__v" data-r="4">
              <p class="km-r10-narr-S__src">A proposal</p>
              <p class="km-r10-narr-S__say"><span class="km-r10-narr-S__was"><span class="ac-sr">Before: </span>Scope: a data integration project for your ops team.</span><span class="km-r10-narr-S__now"><span class="ac-sr">Now: </span>Scope: a forecast with no new data to collect.</span><span class="km-r10-narr-S__caret" aria-hidden="true"></span></p>
            </li>
            <li class="km-r10-narr-S__v" data-r="5">
              <p class="km-r10-narr-S__src">The website</p>
              <p class="km-r10-narr-S__say"><span class="km-r10-narr-S__was"><span class="ac-sr">Before: </span>The all-in-one revenue intelligence suite.</span><span class="km-r10-narr-S__now"><span class="ac-sr">Now: </span>Forecasts checked against what closed last quarter.</span><span class="km-r10-narr-S__caret" aria-hidden="true"></span></p>
            </li>
          </ol>

          <!-- what the buyer takes away: five notes (one per voice) that close into one stack, and the count -->
          <div class="km-r10-narr-S__buyer">
            <div class="km-r10-narr-S__stack" aria-hidden="true">
              <span class="km-r10-narr-S__tag" data-v="1" data-k="4"><span class="km-r10-narr-S__tsrc">Call</span><span class="km-r10-narr-S__tt"><span class="km-r10-narr-S__tw">An AI platform?</span><span class="km-r10-narr-S__tn">A forecast my CFO can sign.</span><span class="km-r10-narr-S__caret"></span></span></span>
              <span class="km-r10-narr-S__tag" data-v="2" data-k="3"><span class="km-r10-narr-S__tsrc">Email</span><span class="km-r10-narr-S__tt"><span class="km-r10-narr-S__tw">A quota tool?</span><span class="km-r10-narr-S__tn">A forecast my CFO can sign.</span><span class="km-r10-narr-S__caret"></span></span></span>
              <span class="km-r10-narr-S__tag" data-v="3" data-k="2"><span class="km-r10-narr-S__tsrc">Post</span><span class="km-r10-narr-S__tt"><span class="km-r10-narr-S__tw">A spreadsheet fix?</span><span class="km-r10-narr-S__tn">A forecast my CFO can sign.</span><span class="km-r10-narr-S__caret"></span></span></span>
              <span class="km-r10-narr-S__tag" data-v="4" data-k="1"><span class="km-r10-narr-S__tsrc">Proposal</span><span class="km-r10-narr-S__tt"><span class="km-r10-narr-S__tw">A data project?</span><span class="km-r10-narr-S__tn">A forecast my CFO can sign.</span><span class="km-r10-narr-S__caret"></span></span></span>
              <span class="km-r10-narr-S__tag is-front" data-v="5" data-k="0"><span class="km-r10-narr-S__tsrc">Website</span><span class="km-r10-narr-S__tt"><span class="km-r10-narr-S__tw">An all-in-one suite?</span><span class="km-r10-narr-S__tn">A forecast my CFO can sign.</span><span class="km-r10-narr-S__caret"></span></span></span>
            </div>
            <p class="km-r10-narr-S__read" aria-hidden="true"><span class="km-r10-narr-S__rn">1</span><span class="km-r10-narr-S__ru">company</span></p>
            <p class="ac-sr">What the buyer takes away. Before: an AI platform, a quota tool, a spreadsheet fix, a data project and an all-in-one suite, so five different companies. Now, from all five voices: a forecast my CFO can sign, so one company.</p>
          </div>
        </div>

        <figcaption class="ac-capband km-r10-narr-S__band">

          <button type="button" class="ac-go ac-go--bare km-r10-narr-S__replay">Replay</button>
