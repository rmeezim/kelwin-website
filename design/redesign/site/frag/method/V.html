<section class="km km-method-V ac-sec" id="methodology" data-surface="dark" aria-labelledby="km-method-V-h">

  <!-- Round 4 · method · slot V — "Round-2 X, evolved".
       Head (family grammar): label → two-voice statement → 48×2 rule → lede, note bottom-right.
       FIG. 05 · one plate, read top → bottom and left → right:
         four phase columns (index · name · output) sit on a calibrated ruler; under the ruler,
         the phase gantt in the same four bays; at the foot, the ownership axis:
         Kelwin's side ──── [Handover] ──── Yours ──→ (runs off the page).
       Only the audit is measured: the ruler carries ten working-day intervals over the red
       Diagnose bar, then an axis break; everything after the break is Indicative.
       The Handover datum is the one vertical through the gantt; Calibrate starts on it and
       leaves the plate through its right edge, across the margin and off the page.
       Geometry (plate-local px; plate 1312 wide; bay k starts at 328k, text and bars at bay + 32):
         ruler y 252 · lanes (10px bars) at 284 / 320 / 356 / 392 · ownership axis y 436 ·
         field 476 · Diagnose bar 32 → 252 (ten intervals of 22) · Architect 360 → 640 ·
         Install 688 → 968 · Handover datum x 984 · Calibrate 984 → off the page.            -->

  <div class="ac-head ac-wrap">
    <div class="ac-labelrow"><p class="ac-label">The method</p></div>
    <h2 class="ac-statement" id="km-method-V-h">
      <span class="ac-line"><span>It starts with</span></span>
      <span class="ac-line ac-accent"><span>the audit.</span></span>
    </h2>
    <span class="ac-rule" aria-hidden="true"></span>
    <p class="ac-lede">The first three phases run once, in order. The fourth keeps running — a system left alone drifts the moment the market moves.</p>
    <aside class="ac-note"><p class="ac-label">Engagements</p><p class="ac-note__t">Install first, then an operating retainer — on a system you own.</p></aside>
  </div>

  <div class="ac-wrap km-method-V__body">
    <figure class="ac-plate km-method-V__plate">
      <div class="ac-field km-method-V__field" style="--h:476px">

        <svg class="ac-svg km-method-V__draw" viewBox="0 0 1312 476" width="1312" height="476" aria-hidden="true">
          <!-- bay dividers: through the column zone only, so the gantt keeps one vertical (the datum) -->
          <line class="ac-s-faint km-method-V__div" style="--i:0" pathLength="1" x1="328.5" y1="0" x2="328.5" y2="252"/>
          <line class="ac-s-faint km-method-V__div" style="--i:1" pathLength="1" x1="656.5" y1="0" x2="656.5" y2="252"/>

          <!-- lane guides (construction) -->
          <g class="km-method-V__lanes">
            <line class="ac-s-faint ac-s-dash" x1="0" y1="289.5" x2="1312" y2="289.5"/>
            <line class="ac-s-faint ac-s-dash" x1="0" y1="325.5" x2="1312" y2="325.5"/>
            <line class="ac-s-faint ac-s-dash" x1="0" y1="361.5" x2="1312" y2="361.5"/>
            <line class="ac-s-faint ac-s-dash" x1="0" y1="397.5" x2="1312" y2="397.5"/>
          </g>

          <!-- the ruler: calibrated over the audit, broken, then indicative -->
          <line class="ac-s-mute km-method-V__rul km-method-V__rul--a" pathLength="1" x1="0" y1="252.5" x2="275" y2="252.5"/>
          <line class="ac-s-mute km-method-V__rul km-method-V__rul--b" pathLength="1" x1="285" y1="252.5" x2="1312" y2="252.5"/>
          <g class="km-method-V__brk">
            <line class="ac-s" x1="270.5" y1="259" x2="277.5" y2="246"/>
            <line class="ac-s" x1="280.5" y1="259" x2="287.5" y2="246"/>
          </g>
          <g class="km-method-V__ticks">
            <line class="km-method-V__tick km-method-V__tick--maj" style="--i:0;--j:5px"   x1="32.5"  y1="252.5" x2="32.5"  y2="261"/>
            <line class="km-method-V__tick" style="--i:1;--j:-4px"  x1="54.5"  y1="252.5" x2="54.5"  y2="257"/>
            <line class="km-method-V__tick" style="--i:2;--j:7px"   x1="76.5"  y1="252.5" x2="76.5"  y2="257"/>
            <line class="km-method-V__tick" style="--i:3;--j:-6px"  x1="98.5"  y1="252.5" x2="98.5"  y2="257"/>
            <line class="km-method-V__tick" style="--i:4;--j:3px"   x1="120.5" y1="252.5" x2="120.5" y2="257"/>
            <line class="km-method-V__tick km-method-V__tick--maj" style="--i:5;--j:-8px"  x1="142.5" y1="252.5" x2="142.5" y2="261"/>
            <line class="km-method-V__tick" style="--i:6;--j:6px"   x1="164.5" y1="252.5" x2="164.5" y2="257"/>
            <line class="km-method-V__tick" style="--i:7;--j:-3px"  x1="186.5" y1="252.5" x2="186.5" y2="257"/>
            <line class="km-method-V__tick" style="--i:8;--j:8px"   x1="208.5" y1="252.5" x2="208.5" y2="257"/>
            <line class="km-method-V__tick" style="--i:9;--j:-5px"  x1="230.5" y1="252.5" x2="230.5" y2="257"/>
            <line class="km-method-V__tick km-method-V__tick--maj" style="--i:10;--j:4px" x1="252.5" y1="252.5" x2="252.5" y2="261"/>
          </g>
          <!-- phase gates on the indicative stretch -->
          <g class="km-method-V__gates">
            <line class="ac-s" x1="360.5" y1="252.5" x2="360.5" y2="261"/>
            <line class="ac-s" x1="688.5" y1="252.5" x2="688.5" y2="261"/>
          </g>

          <!-- after handover, Kelwin's lane carries on dashed (the optional retainer), past the plate edge -->
          <g class="km-method-V__ret">
            <rect class="ac-f-occ" x="996" y="355" width="316" height="13"/>
            <line x1="1000" y1="361" x2="1440" y2="361"/>
          </g>

          <!-- the Handover datum: drawn up from the ownership axis to the top of the plate -->
          <line class="km-method-V__datum" pathLength="1" x1="984.5" y1="423" x2="984.5" y2="-16"/>
          <line class="km-method-V__dcap" x1="978.5" y1="-15.5" x2="990.5" y2="-15.5"/>
          <rect class="km-method-V__dnode" x="981" y="249" width="7" height="7"/>

          <!-- the ownership axis, Kelwin's side (the label knocks out of it) -->
          <line class="ac-s-mute km-method-V__axl" pathLength="1" x1="32.5" y1="436.5" x2="932" y2="436.5"/>
          <line class="ac-s-mute km-method-V__axt" x1="32.5" y1="431" x2="32.5" y2="442"/>
        </svg>

        <ol class="km-method-V__cols" aria-label="The four phases">
          <li class="km-method-V__col km-method-V__col--1">
            <div class="km-method-V__txt">
              <p class="ac-idx km-method-V__idx">01 · Start</p>
              <h3 class="ac-h3 km-method-V__name">Diagnose</h3>
              <p class="ac-idx km-method-V__key">Output</p>
              <p class="ac-body km-method-V__out">The real constraint, named — in a written readout.</p>
            </div>
            <span class="km-method-V__bar km-method-V__bar--1" aria-hidden="true"></span>
            <p class="ac-cap km-method-V__dim"><span data-count>10</span> working days · the System Audit</p>
          </li>
          <li class="km-method-V__col km-method-V__col--2">
            <div class="km-method-V__txt">
              <p class="ac-idx km-method-V__idx">02</p>
              <h3 class="ac-h3 km-method-V__name">Architect</h3>
              <p class="ac-idx km-method-V__key">Output</p>
              <p class="ac-body km-method-V__out">Operating model, written down.</p>
            </div>
            <span class="km-method-V__bar km-method-V__bar--2" aria-hidden="true"></span>
          </li>
          <li class="km-method-V__col km-method-V__col--3">
            <div class="km-method-V__txt">
              <p class="ac-idx km-method-V__idx">03</p>
              <h3 class="ac-h3 km-method-V__name">Install</h3>
              <p class="ac-idx km-method-V__key">Output</p>
              <p class="ac-body km-method-V__out">In use across the team.</p>
            </div>
            <span class="km-method-V__bar km-method-V__bar--3" aria-hidden="true"></span>
          </li>
          <!-- the datum, in reading order: the same word as the handover section's datum -->
          <li class="km-method-V__ho"><span>Handover</span></li>
          <li class="km-method-V__col km-method-V__col--4">
            <div class="km-method-V__txt">
              <p class="ac-idx km-method-V__idx">04 · Continuous</p>
              <h3 class="ac-h3 km-method-V__name">Calibrate</h3>
              <p class="ac-idx km-method-V__key">Output</p>
              <p class="ac-body km-method-V__out">A standing signal review — yours, run by your operator or with us on retainer.</p>
            </div>
            <span class="km-method-V__bar km-method-V__bar--4" aria-hidden="true"><span class="km-method-V__pkt"></span></span>
            <p class="km-method-V__yours"><span class="ac-cap">Yours</span></p>
            <p class="ac-cap km-method-V__retl" aria-hidden="true">With us on retainer</p>
          </li>
        </ol>

        <p class="ac-cap km-method-V__kside">Kelwin’s side</p>
      </div>
      <figcaption class="ac-tblock km-method-V__tb"><span>Fig. 05</span><span>Phase track</span><span>Indicative</span></figcaption>
    </figure>
  </div>
</section>
