    <div class="ac-labelrow"><p class="ac-label">The method</p><p class="ac-meta">Fig. 08</p></div>
    <h2 class="ac-statement" id="km-method-X-h">
      <span class="ac-line"><span>We install the system.</span></span>
      <span class="ac-line ac-accent"><span>Then keep it sharp.</span></span>
    </h2>
    <span class="ac-rule" aria-hidden="true"></span>
    <p class="ac-lede">The first three run once, in order. The fourth keeps running — a system left alone drifts the moment the market moves.</p>
    <aside class="ac-note"><p class="ac-label">A system, not a project</p><p class="ac-note__t">Phase 01 is the System Audit. Every engagement starts there.</p></aside>
  </div>
