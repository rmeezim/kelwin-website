      <span class="ac-line"><span>Your <span class="ac-accent">stack,</span></span></span>

  <!-- the plate: a SHEET — the page's strongest document, the first page of the Orchestration Rules
       (plan §5: a large "When … then …" sheet, rule text 24px), CROPPED by the plate in the white
       between rules 2 and 3 (coherence pass 3: the head as short as the crop allows — 2,282px
       held whole, 1,867 cut after rule 3, now cut after rule 2 at every width above a phone). Running head
       with Specimen once, the document's own name as its title (D6: one document, one name —
       "Routing rules" is gone), a lead tying it to the readout's invented company, section 1
       (what must be true before any rule fires), section 2 (the five rules; When / Then as column
       heads in the key voice, said once; channel and owner as one quiet line under each action);
       folio 1. No window, no route graph, no selected row. (Coherence pass: the CRM blueprint that
       held this plate is cut — two near-identical sheets on one page, and the weaker one first.) -->
  <figure class="ac-plate ac-plate--sheet km-capability-head-T__plate" style="--sheet-c:2;--sheet-s:10" aria-labelledby="km-capability-head-T-rules">
    <article class="ac-sheet ac-sheet--auto km-capability-head-T__sheet" data-surface="light">
      <header class="ac-sheet__run"><span>Kelwin · GTM Infrastructure</span><span>Specimen</span></header>
      <div class="ac-sheet__body">
        <h2 class="ac-sheet__title" id="km-capability-head-T-rules">Orchestration Rules</h2>
        <p class="ac-sheet__lead">For the invented company in the readout specimen. Every install writes its own rules from the client’s signal map.</p>
        <div class="ac-sheet__sec">
          <h3 class="ac-sheet__h"><span class="ac-sheet__n">1</span>Before any rule fires</h3>
          <p>Sending domains are separated and aged, SPF, DKIM and DMARC are aligned, suppression is honored, and every record is verified before anything is sent to it.</p>
        </div>
        <div class="ac-sheet__sec">
          <h3 class="ac-sheet__h"><span class="ac-sheet__n">2</span>The rules</h3>
          <table class="km-capability-head-T__rules">
            <thead><tr><th scope="col"><span class="ac-sr">Rule</span></th><th class="ac-key" scope="col">When</th><th class="ac-key" scope="col">Then</th></tr></thead>
            <tbody>
            <tr>
              <th scope="row" class="km-capability-head-T__n">1</th>
              <td class="km-capability-head-T__when">An account in the ICP opens a sales-leadership or RevOps role</td>
              <td class="km-capability-head-T__then">It moves to this quarter’s priority list, and the account owner gets a brief<span class="km-capability-head-T__meta">Email, then LinkedIn · Account owner</span></td>
            </tr>
            <tr>
              <th scope="row" class="km-capability-head-T__n">2</th>
              <td class="km-capability-head-T__when">A second person from a priority account replies or books</td>
              <td class="km-capability-head-T__then">The champion gets the committee one-pager from the Narrative OS<span class="km-capability-head-T__meta">Email · Account owner</span></td>
            </tr>
            <tr>
              <th scope="row" class="km-capability-head-T__n">3</th>
              <td class="km-capability-head-T__when">A deal sits in security review for ten working days</td>
              <td class="km-capability-head-T__then">The risk-review pack goes to the champion, and a technical call is offered<span class="km-capability-head-T__meta">Email · AE and SE</span></td>
            </tr>
            <tr>
              <th scope="row" class="km-capability-head-T__n">4</th>
              <td class="km-capability-head-T__when">A reply names a competitor</td>
              <td class="km-capability-head-T__then">The objection is logged and answered from the Narrative OS<span class="km-capability-head-T__meta">CRM task · Account owner</span></td>
            </tr>
            <tr>
              <th scope="row" class="km-capability-head-T__n">5</th>
              <td class="km-capability-head-T__when">A sending domain’s complaint rate rises</td>
              <td class="km-capability-head-T__then">Sending pauses on that domain, and the operator is alerted<span class="km-capability-head-T__meta">No send · Operator</span></td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
      <footer class="ac-sheet__folio"><span class="ac-numeral">1</span></footer>
