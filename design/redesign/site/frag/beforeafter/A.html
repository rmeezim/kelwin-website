    <span class="km-beforeafter-A__rule" aria-hidden="true"></span>
    <p class="km-beforeafter-A__lede">Same team, same market. What changes is the system underneath — and everything that system produces.</p>
    <aside class="km-beforeafter-A__note" aria-label="The difference">
      <p class="km-beforeafter-A__label"><span class="km-beforeafter-A__sq" aria-hidden="true"></span>The difference</p>
      <p class="km-beforeafter-A__nt">The activity can look the same. The system underneath is the difference.</p>
    </aside>
