name: Deploy to GitHub Pages

# Trigger on main only. Feature-branch pushes used to start a second run
# that couldn't deploy (github-pages environment is main-only) but still
# cancelled the real main run via the shared concurrency group — the
# source of the recurring "flaky" deploy failures.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least access: the run's token can only read, and each job asks for exactly
# what it uses. The build job (which runs every npm package's code) can't
# deploy or mint an identity token; only the deploy job can.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

# Every action is pinned to a full commit (its tag in the comment), so a moved
# tag can't change what runs here. To update one, resolve the new tag with
# `git ls-remote https://github.com/<owner>/<action> refs/tags/<tag>`.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pages: read # configure-pages reads the site's settings
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Don't leave the token in .git/config for later steps to read.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pages is already on, so no `enablement` (which would need write access).
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /kelwin-website

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
